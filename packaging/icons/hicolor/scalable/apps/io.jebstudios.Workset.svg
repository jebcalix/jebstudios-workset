<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Workset">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F3D3E"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="tileA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="tileB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="tileC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Rounded app plate -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)"/>

  <!-- Workspace tiles (profile / workset metaphor) -->
  <rect x="26" y="26" width="44" height="34" rx="8" fill="url(#tileA)"/>
  <rect x="78" y="26" width="24" height="34" rx="8" fill="url(#tileB)" opacity="0.95"/>
  <rect x="26" y="68" width="24" height="34" rx="8" fill="url(#tileC)" opacity="0.95"/>
  <rect x="58" y="68" width="44" height="34" rx="8" fill="#ECFDF5" opacity="0.92"/>

  <!-- Subtle divider suggesting monitors/workspaces -->
  <path d="M64 26v76" stroke="#042F2E" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
</svg>
